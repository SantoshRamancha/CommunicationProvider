# Builds and tests every push and pull request.
# Pushing a version tag (e.g. v1.0.0) also publishes Kinichit.Communication <version> to GitHub Packages.
name: build-and-publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - run: dotnet restore CommunicationProvider.sln
      - run: dotnet build CommunicationProvider.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      # Throwaway SQL Server so the email queue's SqlServer store is tested too. The password is generated per run.
      - name: Start SQL Server for the email queue tests
        shell: bash
        run: |
          pw="Kc$(openssl rand -hex 12)!a1"
          echo "::add-mask::$pw"
          docker run -d --name sql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$pw" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$pw" -Q "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$pw" -Q "CREATE DATABASE CommunicationTests"
          echo "COMMUNICATION_TEST_SQLSERVER=Server=localhost,1433;Database=CommunicationTests;User Id=sa;Password=$pw;TrustServerCertificate=true" >> "$GITHUB_ENV"

      - run: dotnet test CommunicationProvider.sln -c Release --no-build

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet pack src/Kinichit.Communication/Kinichit.Communication.csproj -c Release --no-build -o out -p:Version=${{ steps.version.outputs.value }}

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "out/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
