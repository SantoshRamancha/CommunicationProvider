# Builds and tests every push and pull request.
# Pushing a version tag (e.g. v1.0.0) also publishes Kinichit.Communication <version> to GitHub Packages.
name: build-and-publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - run: dotnet restore CommunicationProvider.sln
      - run: dotnet build CommunicationProvider.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.value }}
      - run: dotnet test CommunicationProvider.sln -c Release --no-build

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet pack src/Kinichit.Communication/Kinichit.Communication.csproj -c Release --no-build -o out -p:Version=${{ steps.version.outputs.value }}

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "out/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
